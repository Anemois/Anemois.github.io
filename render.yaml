# Render setup for the game server (server/). Render reads this file when
# you create a "Blueprint" from this repo: see server/README.md.

services:
  - type: web
    name: anemois-game-server
    runtime: node
    plan: free
    region: singapore                 # the closest Render region to Taiwan
    rootDir: server
    buildCommand: npm install         # nothing to install, but Render wants a build step
    startCommand: node server.js
    healthCheckPath: /health
    autoDeployTrigger: commit         # a push to main updates the server
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://www.csie.ntu.edu.tw
      - key: NODE_VERSION
        value: "22"

  # The 午後激盪 server for its web build (games/brainstorm): the game's own dedicated server, run from the same
  # index.pck the site serves. It only rebuilds when that file or its folder changes: see server/brainstorm/readme.md.
  - type: web
    name: afternoon-brainstorm-server
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./server/brainstorm/Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - server/brainstorm/**
        - games/brainstorm/web/index.pck
