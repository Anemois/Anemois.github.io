<div id="anetan">

    <div class="anetan-header">
        <h2 class="anetan-title">Anetan</h2>
        <span id="anetan-highscore">Highscore: 0</span>
    </div>

    <div class="anetan-content">

        <div class="anetan-board-header">
            <span id="anetan-score">Score: 0</span>
            <span id="anetan-balls">Balls: 1</span>
        </div>

        <div class="anetan-board-container">
            <canvas
                id="anetan-board"
                width="360"
                height="540"
                tabindex="0"
                aria-label="Anetan game"
            ></canvas>
        </div>

    </div>

</div>
