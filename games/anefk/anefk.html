<div class="game anefk">
    <header class="af-head">
        <h2><span class="af-emblem" aria-hidden="true"></span>AneFK</h2>
        <span class="af-summary"></span>
    </header>
    <div class="anefk-content" inert>
        <nav class="af-nav" aria-label="Seeker fields">
            <div class="af-tabs"></div>
            <button class="af-chart"><span aria-hidden="true">✧</span> Constellation</button>
        </nav>
        <div class="af-layout">
            <section class="af-stage">
                <header class="af-stage-head">
                    <div><small class="af-sector"></small><h3 class="af-name"></h3></div>
                    <div class="af-wallet"><strong></strong><small></small></div>
                </header>
                <div class="af-glass">
                    <canvas tabindex="0" aria-label="Seeker field. Click to aim a dash, or press Space to dash toward the nearest orb."></canvas>
                    <div class="af-nodes" hidden></div>
                </div>
                <div class="af-command"><span class="af-guide"></span><span class="af-charge"></span></div>
            </section>
            <aside class="af-side">
                <section class="af-workshop">
                    <h3>Seeker upgrades</h3>
                    <div class="af-upgrades"></div>
                    <div class="af-discovery">
                        <small>Next discovery</small>
                        <strong class="af-next"></strong>
                        <progress class="af-progress" max="1" value="0"></progress>
                        <span class="af-goal"></span>
                    </div>
                </section>
                <section class="af-prestige" hidden>
                    <h3>Prestige</h3>
                    <p class="af-ritual"></p>
                    <div class="af-discovery">
                        <small>Permanent flight speed</small>
                        <strong class="af-bonus"></strong>
                        <span class="af-reset-note"></span>
                    </div>
                    <button class="af-ascend" hidden>Start new orbit</button>
                    <button class="af-return">Return to field</button>
                </section>
            </aside>
        </div>
        <footer class="af-foot">
            <span class="af-status" role="status"></span>
            <div><button class="af-export">Export</button><button class="af-import">Import</button></div>
        </footer>
    </div>
</div>
