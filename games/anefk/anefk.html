<div class="game anefk">

    <div class="anefk-header">
        <h2 class="anefk-title">AneFK</h2>
        <div class="anefk-stats">
            <span id="anefk-blobs">0 blobs</span>
            <span id="anefk-rate">0/s</span>
            <span id="anefk-orb">0/orb</span>
            <span id="anefk-golden">0 golden</span>
            <span id="anefk-gold">0 gold</span>
        </div>
    </div>

    <div class="anefk-content">

        <div class="anefk-layout">

            <div id="orb-field" class="orb-field"></div>

            <div class="afk-panel">

                <div class="panel-buttons">
                    <button id="export-save">Export</button>
                    <button id="import-save">Import</button>
                    <button id="open-tree">Skill Tree</button>
                    <button id="prestige">Prestige</button>
                </div>

                <div id="buy-amount" class="buy-amount"></div>

                <h3>Upgrades</h3>
                <div id="upgrades"></div>

                <h3>Helpers</h3>
                <div id="helpers"></div>

            </div>

        </div>

        <div class="tree-view">

            <div class="tree-header">
                <h3>Skill Tree</h3>
                <span id="tree-gold">0 gold</span>
                <button id="tree-close">Close</button>
            </div>

            <div id="tree-viewport" class="tree-viewport">
                <div id="tree-map" class="tree-map"></div>
            </div>

            <div id="tree-info" class="tree-info"></div>

        </div>

    </div>

</div>
